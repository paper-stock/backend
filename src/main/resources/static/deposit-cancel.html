<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wpłata anulowana – PaperStock</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --accent: #16a34a; --neutral-soft: #e5e7eb; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #f3f4f6; --muted: #9ca3af;
      --accent: #4ade80; --neutral-soft: #272b33; --border: #272b33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 24px; text-align: center;
  }
  .icon {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 20px;
    display: grid; place-items: center; font-size: 30px; font-weight: 700;
    background: var(--neutral-soft); color: var(--muted);
  }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  .btn {
    display: inline-block; padding: 12px 20px; border-radius: 10px; text-decoration: none;
    font-weight: 600; background: var(--accent); color: #fff; font-size: 1rem;
  }
  @media (prefers-color-scheme: dark) { .btn { color: #0b1a10; } }
  .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); margin-left: 8px; }
  @media (max-width: 400px) {
    .btn, .btn.secondary { display: block; margin: 8px 0 0; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="icon">×</div>
  <h1>Wpłata anulowana</h1>
  <p>Płatność nie została zrealizowana i z Twojego konta nie pobrano żadnych środków. Możesz spróbować ponownie, kiedy chcesz.</p>
  <a class="btn" href="/deposit">Wróć do wpłaty</a>
  <a class="btn secondary" href="/portfolio">Do portfela</a>
</main>
</body>
</html>
