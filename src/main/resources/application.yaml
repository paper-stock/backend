server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: paper-stock
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:paper-stock
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 #15min
  refresh-token:
    expiration: 604800000 #7days

logging:
  level:
    pl.maropce.paperstock: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} [%thread] %clr(%-5level) %clr(%logger{20}){cyan} - %msg%n"

