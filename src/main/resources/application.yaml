server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: paper-stock
  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:mem:paper-stock}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100

app:
  security:
    frame-options: DENY
  websocket:
    send-time-limit: 10s
    buffer-size-limit: 512KB

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 #15min
  refresh-token:
    expiration: 604800000 #7days

alpaca:
  max-pages: 10
  api:
    key: ${ALPACA_API_KEY}
    secret: ${ALPACA_API_SECRET}
    data-url: https://data.alpaca.markets
    trading-url: https://paper-api.alpaca.markets/v2
    streamUrl: wss://stream.data.alpaca.markets/v2/delayed_sip

logo:
  dev:
    host: https://img.logo.dev
    publishable-key: ${LOGO_DEV_PUBLISHABLE_KEY}

stock:
  sync:
    cron: 0 0 3 * * * # Every day at 3 AM
    timezone: UTC

refresh-token:
  cleanup:
    cron: 0 0 3 * * * # Every day at 3 AM
    timezone: UTC

logging:
  level:
    pl.maropce.paperstock: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} [%thread] %clr(%-5level) %clr(%logger{20}){cyan} - %msg%n"

default:
  users:
    initialize: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: false