server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: paper-stock
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:paper-stock
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 #15min
  refresh-token:
    expiration: 604800000 #7days

alpaca:
  api:
    key: ${ALPACA_API_KEY}
    secret: ${ALPACA_API_SECRET}
    data-url: https://data.alpaca.markets/v2
    trading-url: https://paper-api.alpaca.markets/v2
    streamUrl: wss://stream.data.alpaca.markets/v2/delayed_sip

logo:
  dev:
    host: https://img.logo.dev
    publishable-key: ${LOGO_DEV_PUBLISHABLE_KEY}

stock:
  sync:
    cron: 0 0 3 * * * # Every day at 3 AM
    zone: UTC

logging:
  level:
    pl.maropce.paperstock: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} [%thread] %clr(%-5level) %clr(%logger{20}){cyan} - %msg%n"

default:
  users:
    initialize: true